version: "3.8"
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      # Uncomment the next line if using SSL
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - auth-service
      - reservation-service
    networks:
      - my-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - reservation-service
    networks:
      - my-network

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    networks:
      - my-network

  reservation-service:
    build: ./reservation-service
    ports:
      - "8002:8002"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
