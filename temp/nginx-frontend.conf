worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Serve frontend app1
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html/app1;  # Serve frontend app from here
            index index.html;
            try_files $uri /index.html;  # Fallback to index.html for SPAs (Single Page Applications)
        }

        # Proxy API requests to backend services via API Gateway
        location /api/ {
            proxy_pass http://api_gateway:8000;  # Forward API calls to the API Gateway
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
